name: inventaris_app
description: "Aplikasi Android Inventaris Petugas"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0
  mobile_scanner: ^6.0.0
  image_picker: ^1.1.0
  cached_network_image: ^3.3.0
  google_fonts: ^6.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
